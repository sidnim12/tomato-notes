name: Developer bug ticket
description: Track a verified internal report without copying private user information.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not copy user emails or private report details into this public issue.
  - type: textarea
    id: summary
    attributes:
      label: Sanitized summary
      description: Describe the verified behavior without personal information.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Verified environment
      placeholder: iPhone 15, iOS 19, Safari
  - type: textarea
    id: notes
    attributes:
      label: Engineering notes
